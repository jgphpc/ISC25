cat simple_trigger_actions.yaml

-
  action: "add_pipelines"
  pipelines:
    pl_threshold_thin_clip_y:
      f1:
        type: "threshold"
        params:
          field: "y"
          min_value: 0.01
          max_value: 1000
-
  action: "add_scenes"
  scenes:
    s1:
      plots:
        p2:
          type: "pseudocolor"
          field: "rhop"
          pipeline: "pl_threshold_thin_clip_y"
