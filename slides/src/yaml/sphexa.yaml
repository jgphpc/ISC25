Creating output folder: datasets/
-
  action: "add_triggers"
  triggers:
    t1:
      params:
        condition: "cycle() % 5 == 0"
        actions:
          -
            action: "add_pipelines"
            pipelines:
              pl_threshold_thin_clip_z:
                f1:
                  type: "threshold"
                  params:
                    field: "z"
                    min_value: 0.12425
                    max_value: 0.12575
              pl_threshold_thin_clip_y:
                f1:
                  type: "threshold"
                  params:
                    field: "y"
                    min_value: 0.12425
                    max_value: 0.12575
          -
            action: "add_scenes"
            scenes:
              s1:
                plots:
                  p1:
                    type: "pseudocolor"
                    field: "Density"
                    pipeline: "pl_threshold_thin_clip_z"
                    min_value: 1
                    max_value: 10
                    color_table:
                      name: "Yellow - Gray - Blue"
                      annotation: "false"
                    points:
                      radius: 0.002
                  p2:
                    type: "pseudocolor"
                    field: "Density"
                    pipeline: "pl_threshold_thin_clip_y"
                    min_value: 1
                    max_value: 10
                    color_table:
                      name: "Yellow - Gray - Blue"
                      annotation: "true"
                    points:
                      radius: 0.002
                renders:
                  r1:
                    image_prefix: "datasets/Density.%05d"
                    image_width: 1920
                    image_height: 1080
                    camera:
                      look_at: [0.5, 0.125, 0.125]
                      position: [0.5, 0.125, 3.0]
                      up: [0.0, 1.0, 0.0]
                      azimuth: -35.0
                      elevation: 25.0
                      zoom: 5.25
                    ... ( skipped 1 child )
                    fg_color: [0.0, 0.0, 0.0]
                    dataset_bounds: [0.0, 1.0, 0.0, ..., 0.0, 0.25]
                    color_bar_position: [0.2, 0.9, -0.9, -0.75]

